name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.0)"
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Desktop Artifacts (${{ matrix.target }})
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin/arm64
            dir_name: darwin-arm64
            archive_name: rainforest-darwin-arm64.tar.gz
          - os: macos-latest
            target: darwin/amd64
            dir_name: darwin-amd64
            archive_name: rainforest-darwin-amd64.tar.gz
          - os: ubuntu-latest
            target: linux/amd64
            dir_name: linux-amd64
            archive_name: rainforest-linux-amd64.tar.gz
          - os: ubuntu-latest
            target: linux/arm64
            dir_name: linux-arm64
            archive_name: rainforest-linux-arm64.tar.gz
          - os: windows-latest
            target: windows/amd64
            dir_name: windows-amd64
            archive_name: rainforest-windows-amd64.zip
          - os: windows-latest
            target: windows/arm64
            dir_name: windows-arm64
            archive_name: rainforest-windows-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install Go via mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: go
          cache: false

      - name: Verify release tag matches mygo.config.ts version
        shell: bash
        env:
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          cfg_ver=$(grep -E '^[[:space:]]*version:' mygo.config.ts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [[ "$TAG" == v* ]] && [[ "$TAG" != "v${cfg_ver}" ]]; then
            echo "::error title=Version mismatch::Tag $TAG does not match mygo.config.ts version v${cfg_ver}"
            exit 1
          fi

      - name: Run pre-release tests
        run: |
          go test -race ./...

      - name: Build MyGo desktop bundle (${{ matrix.target }})
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_TARGET: ${{ matrix.target }}
          DIR_NAME: ${{ matrix.dir_name }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          MACOS_NOTARIZE_PROFILE: ${{ secrets.MACOS_NOTARIZE_PROFILE }}
          MYGO_UPDATER_PUBLIC_KEY: ${{ secrets.MYGO_UPDATER_PUBLIC_KEY }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          FLAGS=(-platform "$MATRIX_TARGET" -o dist)
          if [[ "$MATRIX_OS" == macos-* ]]; then
            if [[ -z "${MACOS_SIGNING_IDENTITY:-}" ]]; then
              FLAGS+=(-skip-dmg)
            fi
            if [[ -z "${MACOS_NOTARIZE_PROFILE:-}" ]]; then
              FLAGS+=(-skip-notarize)
            fi
          else
            FLAGS+=(-skip-dmg -skip-notarize)
          fi
          go tool mygo build "${FLAGS[@]}"
          if [[ -n "${MYGO_UPDATER_PRIVATE_KEY:-}" ]]; then
            manifest="dist/${DIR_NAME}/update-${DIR_NAME}.json"
            test -s "$manifest"
            grep -q '"signature":' "$manifest"
          fi

      - name: Package release archive and SHA-256 checksum
        shell: bash
        env:
          ARCHIVE_NAME: ${{ matrix.archive_name }}
          DIR_NAME: ${{ matrix.dir_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          if [[ "$ARCHIVE_NAME" == *.zip ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/*' -DestinationPath 'release-assets/$ARCHIVE_NAME'"
          else
            tar -czf "release-assets/$ARCHIVE_NAME" -C dist .
          fi
          for f in "dist/${DIR_NAME}"/update-*.json "dist/${DIR_NAME}"/rainforest-*-*.tar.gz "dist/${DIR_NAME}"/*.deb "dist/${DIR_NAME}"/*Setup*.exe "dist/${DIR_NAME}"/*.dmg "dist/${DIR_NAME}"/install.sh; do
            if [[ -f "$f" ]]; then
              cp "$f" release-assets/
            fi
          done
          (
            cd release-assets
            for asset in ./*; do
              asset_base="${asset#./}"
              if [[ "$asset_base" == *.sha256 ]]; then continue; fi
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$asset_base" > "${asset_base}.sha256"
              else
                shasum -a 256 "$asset_base" > "${asset_base}.sha256"
              fi
            done
          )

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ strategy.job-index }}
          path: release-assets/*

  release:
    name: Publish GitHub Release
    permissions:
      contents: write
    timeout-minutes: 20
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag_name != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksums.txt
        run: |
          cd artifacts
          cat -- *.sha256 > checksums.txt
          sha256sum -c checksums.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --title "$TAG" --generate-notes
          fi
