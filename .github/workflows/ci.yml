name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain via mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: go gofumpt golangci-lint bun
      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile
      - name: Run quality gates
        run: mise run check
      - name: Verify no uncommitted changes or bindings drift
        run: git diff --exit-code
      - name: Build and smoke test rainforest binary
        run: |
          go build -trimpath -o dist/rainforest .
          ./dist/rainforest --version

  matrix:
    name: Cross-Platform Test & Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: "linux/amd64,linux/arm64"
            archive_name: rainforest-linux-dryrun.tar.gz
          - os: macos-latest
            platform: "darwin/arm64,darwin/amd64"
            archive_name: rainforest-darwin-dryrun.tar.gz
          - os: windows-latest
            platform: "windows/amd64,windows/arm64"
            archive_name: rainforest-windows-dryrun.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Go and Bun via mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: go bun
      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile
      - name: Run frontend fmt-check, lint, typecheck, tests, and production bundle build
        run: |
          bun run --cwd frontend fmt-check
          bun run --cwd frontend lint
          bun run --cwd frontend typecheck
          bun --cwd frontend test
          bun run --cwd frontend build
      - name: Run Go tests and race detector
        run: |
          go test ./...
          go test -race ./...
      - name: Package desktop build via MyGo (dry run)
        run: bunx mygo build -platform "${{ matrix.platform }}" -skip-dmg -skip-notarize -o dist
      - name: Verify packaged artifacts and SHA-256
        env:
          ARCHIVE_NAME: ${{ matrix.archive_name }}
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              for arch in amd64 arm64; do
                test -x "dist/linux-${arch}/rainforest"
                test -s "dist/linux-${arch}/rainforest.desktop"
                test -s "dist/linux-${arch}/install.sh"
                test -s "dist/linux-${arch}/rainforest_0.1.0_${arch}.deb"
                test -s "dist/linux-${arch}/rainforest-0.1.0-linux-${arch}.tar.gz"
                tar -tzf "dist/linux-${arch}/rainforest-0.1.0-linux-${arch}.tar.gz" > "$RUNNER_TEMP/tar-${arch}.list"
                grep -q "rainforest" "$RUNNER_TEMP/tar-${arch}.list"
              done
              ./dist/linux-amd64/rainforest --version
              ;;
            macOS)
              for arch in arm64 amd64; do
                test -x "dist/darwin-${arch}/Rainforest.app/Contents/MacOS/Rainforest"
                test -s "dist/darwin-${arch}/Rainforest.app/Contents/Info.plist"
              done
              ./dist/darwin-arm64/Rainforest.app/Contents/MacOS/Rainforest --version
              ;;
            Windows)
              for arch in amd64 arm64; do
                test -s "dist/windows-${arch}/Rainforest.exe"
              done
              ./dist/windows-amd64/Rainforest.exe --version
              ;;
          esac
          mkdir -p release-dryrun
          if [[ "$ARCHIVE_NAME" == *.zip ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/*' -DestinationPath 'release-dryrun/$ARCHIVE_NAME'"
          else
            tar -czf "release-dryrun/$ARCHIVE_NAME" -C dist .
          fi
          (
            cd release-dryrun
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
              sha256sum -c "${ARCHIVE_NAME}.sha256"
            else
              shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
              shasum -a 256 -c "${ARCHIVE_NAME}.sha256"
            fi
          )
      - name: Upload dry-run package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rainforest-dryrun-${{ matrix.os }}
          path: release-dryrun/*
