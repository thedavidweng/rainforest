[tools]
go = "1.27.3"
gofumpt = "0.12.0"
golangci-lint = "2.15.0"
jactionlint = "2.3.0"

[tasks.build]
run = "go build ./..."

[tasks.test]
run = "go test ./..."

[tasks.test-release]
run = ["python3 scripts/test-macos-release.py", "python3 scripts/test-appimage-release.py"]

[tasks.test-race]
run = "go test -race ./..."

[tasks.vet]
run = "go vet ./..."

[tasks.fmt]
run = "gofumpt -extra -w ."

[tasks.fmt-check]
run = '''
unformatted=$(gofumpt -extra -l .)
if [ -n "$unformatted" ]; then
  echo "gofumpt: files need formatting:"
  echo "$unformatted"
  exit 1
fi
'''

[tasks.mod-tidy-check]
run = '''
tmp_dir=$(mktemp -d)
trap 'rm -rf "$tmp_dir"' EXIT
cp go.mod "$tmp_dir/go.mod"
if [ -f go.sum ]; then cp go.sum "$tmp_dir/go.sum"; fi
go mod tidy -modfile="$tmp_dir/go.mod"
diff -u go.mod "$tmp_dir/go.mod"
if [ -f go.sum ] || [ -f "$tmp_dir/go.sum" ]; then
  diff -u go.sum "$tmp_dir/go.sum"
fi
'''

[tasks.lint]
run = 'golangci-lint run'

[tasks.conventions]
run = '''
for f in CLAUDE.md .cursorrules .windsurfrules .clinerules GEMINI.md; do
  if [ -e "$f" ]; then echo "forbidden per-tool agent file: $f (use AGENTS.md)"; exit 1; fi
done
files=$(find . -path './.git' -prune -o -name '*.go' ! -name '*_test.go' ! -name '*_gen.go' -print)
if [ -n "$files" ]; then
  total=$(cat $files | grep -cv '^[[:space:]]*$')
  comments=$(cat $files | grep -E '^[[:space:]]*//' | grep -cvE '^[[:space:]]*//(go:|nolint)' || true)
  if [ "$comments" -gt $((total * 5 / 100)) ]; then
    echo "comment budget exceeded: $comments comment lines > 5% of $total code lines"; exit 1
  fi
fi
'''

[tasks.i18n-check]
run = '''
tmp_dir=$(mktemp -d)
trap 'rm -rf "$tmp_dir"' EXIT
cp locales/catalog_gen.go "$tmp_dir/catalog_gen.go"
go tool mygo i18n check
go tool mygo generate
diff -u "$tmp_dir/catalog_gen.go" locales/catalog_gen.go
'''

[tasks.icons]
description = "Sync internal/view/icons from the Phosphor version and weight/name lines in icons.txt"
run = '''
set -eu
dir=internal/view/icons
version=$(head -n 1 "$dir/icons.txt")
base="https://unpkg.com/@phosphor-icons/core@$version"
lines=$(tail -n +2 "$dir/icons.txt" | grep -v '^[[:space:]]*$')
files=""
while read -r weight name; do
  if [ "$weight" = regular ]; then file="$name"; else file="$name-$weight"; fi
  curl -fsSL "$base/assets/$weight/$file.svg" -o "$dir/$file.svg"
  files="$files $file"
done <<EOF2
$lines
EOF2
curl -fsSL "$base/LICENSE" -o "$dir/LICENSE-phosphor"
for f in "$dir"/*.svg; do
  name=$(basename "$f" .svg)
  echo "$files" | tr ' ' '\n' | grep -qx "$name" || rm "$f"
done
'''

[tasks.check]
run = [
  "mise run fmt-check",
  "mise run mod-tidy-check",
  "mise run vet",
  "mise run build",
  "mise run test",
  "mise run test-release",
  "mise run test-race",
  "mise run lint",
  "mise run conventions",
  "mise run i18n-check",
]

[tasks.site-build]
description = "Build the website with the real UI running in WebAssembly"
run = """
mkdir -p _site/assets _site/preview
cp -R site/. _site/
cp docs/assets/icon-256.png docs/assets/upload-en-macos.png _site/assets/
GOOS=js GOARCH=wasm go build -tags mygo_noinspector -trimpath -ldflags='-s -w' -o _site/preview/app.wasm .
cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" _site/preview/
"""
