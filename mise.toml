[tools]
go = "1.27.2"
gofumpt = "0.12.0"
golangci-lint = "2.14.0"
bun = "1.4.2"
jactionlint = "2.1.0"

[tasks.build]
run = "go build ./..."

[tasks.test]
run = "go test ./..."

[tasks.test-race]
run = "go test -race ./..."

[tasks.vet]
run = "go vet ./..."

[tasks.fmt]
run = "gofumpt -extra -w ."

[tasks.fmt-check]
run = '''
unformatted=$(gofumpt -extra -l .)
if [ -n "$unformatted" ]; then
  echo "gofumpt: files need formatting:"
  echo "$unformatted"
  exit 1
fi
'''

[tasks.mod-tidy-check]
run = '''
tmp_dir=$(mktemp -d)
trap 'rm -rf "$tmp_dir"' EXIT
cp go.mod "$tmp_dir/go.mod"
if [ -f go.sum ]; then cp go.sum "$tmp_dir/go.sum"; fi
go mod tidy -modfile="$tmp_dir/go.mod"
diff -u go.mod "$tmp_dir/go.mod"
if [ -f go.sum ] || [ -f "$tmp_dir/go.sum" ]; then
  diff -u go.sum "$tmp_dir/go.sum"
fi
'''

[tasks.lint]
run = "golangci-lint run"

[tasks.conventions]
run = '''
for f in CLAUDE.md .cursorrules .windsurfrules .clinerules GEMINI.md; do
  if [ -e "$f" ]; then echo "forbidden per-tool agent file: $f (use AGENTS.md)"; exit 1; fi
done
files=$(find . -path './frontend' -prune -o -path './.git' -prune -o -name '*.go' ! -name '*_test.go' -print)
if [ -n "$files" ]; then
  total=$(cat $files | grep -cv '^[[:space:]]*$')
  comments=$(cat $files | grep -E '^[[:space:]]*//' | grep -cvE '^[[:space:]]*//(go:|nolint)' || true)
  if [ "$comments" -gt $((total * 5 / 100)) ]; then
    echo "comment budget exceeded: $comments comment lines > 5% of $total code lines"; exit 1
  fi
fi
'''

[tasks.bindings-check]
run = '''
tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT
MYGO_GENERATE="$tmp" go run .
diff -u frontend/src/mygo.ts "$tmp"
'''

[tasks.frontend-check]
run = '''
bun run --cwd frontend fmt-check
bun run --cwd frontend lint
bun run --cwd frontend typecheck
bun --cwd frontend test
bun run --cwd frontend build
'''

[tasks.check]
run = [
  "mise run fmt-check",
  "mise run mod-tidy-check",
  "mise run vet",
  "mise run build",
  "mise run test",
  "mise run test-race",
  "mise run lint",
  "mise run conventions",
  "mise run bindings-check",
  "mise run frontend-check",
]
