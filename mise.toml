[tools]
go = "1.27.2"
gofumpt = "0.12.0"
golangci-lint = "2.14.0"
bun = "1.4.2"

[tasks.build]
run = "go build ./..."

[tasks.test]
run = "go test ./..."

[tasks.fmt]
run = "gofumpt -extra -w ."

[tasks.lint]
run = "golangci-lint run"

[tasks.conventions]
run = '''
for f in CLAUDE.md .cursorrules .windsurfrules .clinerules GEMINI.md; do
  if [ -e "$f" ]; then echo "forbidden per-tool agent file: $f (use AGENTS.md)"; exit 1; fi
done
files=$(find . -path './frontend' -prune -o -path './.git' -prune -o -name '*.go' ! -name '*_test.go' -print)
if [ -n "$files" ]; then
  total=$(cat $files | grep -cv '^[[:space:]]*$')
  comments=$(cat $files | grep -E '^[[:space:]]*//' | grep -cvE '^[[:space:]]*//(go:|nolint)' || true)
  if [ "$comments" -gt $((total * 5 / 100)) ]; then
    echo "comment budget exceeded: $comments comment lines > 5% of $total code lines"; exit 1
  fi
fi
'''

[tasks.bindings-check]
run = '''
tmp=$(mktemp)
trap 'rm -f "$tmp"' EXIT
MYGO_GENERATE="$tmp" go run .
diff -u frontend/src/mygo.ts "$tmp"
'''

[tasks.frontend-check]
run = '''
bun run --cwd frontend typecheck
bun --cwd frontend test
bun run --cwd frontend build
'''

[tasks.check]
depends = ["fmt", "build", "test", "lint", "conventions", "bindings-check", "frontend-check"]
